name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check google-services.json
        run: |
          if [ ! -f "mobile/app/google-services.json" ]; then
            echo "::warning::google-services.json not found in mobile/app/. Using fallback placeholder for build."
          fi

      - name: Build Debug APK
        working-directory: mobile
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stash-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk

      - name: Build release bundle and run release lint
        working-directory: mobile
        run: gradle bundleRelease lintRelease --no-daemon

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cash-express-release-unsigned-aab
          path: mobile/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-express-release-lint
          path: mobile/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
